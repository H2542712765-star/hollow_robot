controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    cr10_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

cr10_group_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0

      joint1:
        trajectory: 0.10
        goal: 0.03
      joint2:
        trajectory: 0.10
        goal: 0.03
      joint3:
        trajectory: 0.10
        goal: 0.03
      joint4:
        trajectory: 0.10
        goal: 0.03
      joint5:
        trajectory: 0.10
        goal: 0.03
      joint6:
        trajectory: 0.10
        goal: 0.03